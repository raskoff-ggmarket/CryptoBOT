version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cryptobot_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cryptobot}
      POSTGRES_USER: ${POSTGRES_USER:-cryptobot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptobot123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cryptobot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cryptobot_net

  redis:
    image: redis:7-alpine
    container_name: cryptobot_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cryptobot_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cryptobot_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cryptobot}:${POSTGRES_PASSWORD:-cryptobot123}@postgres:5432/${POSTGRES_DB:-cryptobot}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-supersecretkey123changeme}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - cryptobot_net
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cryptobot_celery
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cryptobot}:${POSTGRES_PASSWORD:-cryptobot123}@postgres:5432/${POSTGRES_DB:-cryptobot}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-supersecretkey123changeme}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    networks:
      - cryptobot_net
    restart: unless-stopped

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cryptobot_beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cryptobot}:${POSTGRES_PASSWORD:-cryptobot123}@postgres:5432/${POSTGRES_DB:-cryptobot}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-supersecretkey123changeme}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    networks:
      - cryptobot_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    container_name: cryptobot_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cryptobot_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: cryptobot_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cryptobot_net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  cryptobot_net:
    driver: bridge
